name: cpfc-europa-trip

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cpfc_trip
      POSTGRES_USER: cpfc
      POSTGRES_PASSWORD: cpfc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=cpfc --dbname=cpfc_trip"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:

