services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: cpfc
      POSTGRES_USER: cpfc
      POSTGRES_PASSWORD: cpfc
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpfc -d cpfc"]
      interval: 2s
      retries: 15
volumes:
  postgres-data:
