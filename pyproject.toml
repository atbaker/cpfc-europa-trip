[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpfc-trip"
version = "0.1.0"
description = "UK departure-city Palace away-trip planner"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic[email]>=2.13",
  "pydantic-settings>=2.10", "pydantic-ai-slim[google,temporal]>=2.40,<3",
  "temporalio>=1.32,<2", "httpx>=0.28", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30", "alembic>=1.16", "cryptography>=45", "svix>=1.60",
  "logfire[fastapi]>=4", "cloud-sql-python-connector[asyncpg]>=1.18",
]
[project.scripts]
cpfc-api = "cpfc_trip.api:main"
cpfc-worker = "cpfc_trip.temporal.worker:main"
cpfc-db = "cpfc_trip.persistence.admin:main"
cpfc-prune = "cpfc_trip.persistence.retention:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.17", "aiosqlite>=0.21", "respx>=0.22"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
